<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="css/midnight.css">
</head>

<body>
    <div class="night-sky">
        <div id="stars"></div>
        <div class="moon"></div>
        <div class="horizon"></div>
    </div>

    <div id="midnight-intro" class="midnight-intro">
        <p class="eyebrow">The clock strikes</p>
        <h1>12:00</h1>
    </div>

    <div id="countdown" class="countdown" aria-live="polite">
        <span id="count-num"></span>
    </div>

    <div id="veil" class="veil"></div>

    <script src="https://unpkg.com/magic-snowflakes/dist/snowflakes.min.js"></script>
    <script src="js/midnight.js"></script>
</body>

</html>
