<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Happy Birthday Antara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="confetti"></canvas>
    <div class="petals" aria-hidden="true"></div>
    <div class="glow glow-left"></div>
    <div class="glow glow-right"></div>

    <div class="main">
        <div class="bunting" aria-hidden="true">
            <span class="flag rose">H</span>
            <span class="flag blush">a</span>
            <span class="flag gold">p</span>
            <span class="flag cream">p</span>
            <span class="flag lilac">y</span>
            <span class="flag spacer"></span>
            <span class="flag blush">B</span>
            <span class="flag rose">i</span>
            <span class="flag gold">r</span>
            <span class="flag cream">t</span>
            <span class="flag lilac">h</span>
            <span class="flag rose">d</span>
            <span class="flag blush">a</span>
            <span class="flag gold">y</span>
        </div>

        <div class="container pt-4">
            <div class="row">
                <div class="col-12 text-center">
                    <p class="eyebrow">A little wish for</p>
                    <div id="name" class="area">Antara</div>
                </div>

                <div class="col-12 text-center">
                    <div class="type-wrap">
                        <div id="typed-strings" class="typing">
                            <h2>Happy Birthday! 🎂✨</h2>
                            <h2>Wishing you endless happiness, beautiful moments, and a year filled with everything your heart desires. 💖</h2>
                        </div>
                        <span id="typed" class="typed-text"></span>
                    </div>
                </div>

                <div class="col-12 col-xl-4 cake">
                    <img src="img/cake.gif" alt="Birthday cake">
                </div>
            </div>
        </div>
        <img src="img/Balloon-Border.png" width="100%" class="balloon-border" alt="">
    </div>
    <div id="party-balloons" class="party-balloons" aria-hidden="true"></div>

    <div class="hug-scene hugging" id="hug-scene" aria-hidden="true">
        <div class="hug-inner">
            <div class="pet lion" id="lion">
                <div class="pet-inner">
                    <svg class="lion-body" viewBox="0 0 160 150" width="168" height="156">
                        <ellipse class="shadow" cx="80" cy="144" rx="40" ry="5" />
                        <g class="tail">
                            <path d="M44 108c-22 8-30 28-18 36" stroke="#e76f3c" stroke-width="7" fill="none" stroke-linecap="round" />
                            <circle cx="24" cy="144" r="8" fill="#c4451d" />
                        </g>
                        <ellipse cx="80" cy="108" rx="40" ry="30" fill="#f4a261" />
                        <ellipse cx="82" cy="114" rx="24" ry="18" fill="#ffd7a8" />
                        <g class="mane">
                            <circle cx="80" cy="52" r="36" fill="#e76f3c" />
                            <circle cx="52" cy="48" r="16" fill="#c4451d" />
                            <circle cx="108" cy="48" r="16" fill="#c4451d" />
                            <circle cx="58" cy="28" r="14" fill="#e76f3c" />
                            <circle cx="102" cy="28" r="14" fill="#e76f3c" />
                            <circle cx="80" cy="20" r="15" fill="#c4451d" />
                            <circle cx="68" cy="72" r="12" fill="#e76f3c" />
                            <circle cx="94" cy="72" r="12" fill="#e76f3c" />

                        <circle cx="54" cy="38" r="9" fill="#f4a261" />
                        <circle cx="106" cy="38" r="9" fill="#f4a261" />
                        <circle cx="54" cy="38" r="5" fill="#f1c0c0" />
                        <circle cx="106" cy="38" r="5" fill="#f1c0c0" />
                        <circle cx="80" cy="52" r="26" fill="#f4a261" />
                        <g class="eyes-hug">
                            <path d="M68 50c3 4 8 4 11 0" stroke="#3b2b1a" stroke-width="2.4" fill="none" stroke-linecap="round" />
                            <path d="M81 50c3 4 8 4 11 0" stroke="#3b2b1a" stroke-width="2.4" fill="none" stroke-linecap="round" />
                        </g>
                        <g class="eyes-open">
                            <circle cx="70" cy="50" r="3" fill="#3b2b1a" />
                            <circle cx="90" cy="50" r="3" fill="#3b2b1a" />
                            <circle cx="71" cy="49" r="1" fill="#fff" />
                            <circle cx="91" cy="49" r="1" fill="#fff" />
                        </g>
                        <ellipse cx="80" cy="60" rx="6" ry="4" fill="#c44536" />
                        <path d="M80 64c-6 7 6 7 0 0" stroke="#c44536" stroke-width="1.8" fill="none" />
                        <path d="M68 62c4 8 20 8 24 0" stroke="#b85c38" stroke-width="1.6" fill="none" stroke-linecap="round" />
                        <g class="legs">
                            <path d="M60 128v14" stroke="#f4a261" stroke-width="9" stroke-linecap="round" />
                            <path d="M74 130v12" stroke="#e76f3c" stroke-width="9" stroke-linecap="round" />
                            <path d="M90 130v12" stroke="#f4a261" stroke-width="9" stroke-linecap="round" />
                            <path d="M104 128v14" stroke="#e76f3c" stroke-width="9" stroke-linecap="round" />
                        </g>
                    </svg>
                </div>
            </div>

            <svg class="lion-arms" viewBox="0 0 270 160" width="270" height="160">
                <g class="arm arm-left">
                    <path d="M118 96 L72 78 L46 118" fill="none" stroke="#f4a261" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M72 78 L54 124" fill="none" stroke="#e89a5a" stroke-width="14" stroke-linecap="round" />

                <g class="arm arm-right">
                    <path d="M152 96 L198 78 L224 118" fill="none" stroke="#f4a261" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M198 78 L216 124" fill="none" stroke="#e89a5a" stroke-width="14" stroke-linecap="round" />
                    <circle cx="220" cy="128" r="13" fill="#e76f51" />
                    <circle cx="227" cy="124" r="3" fill="#c44536" />
                    <circle cx="223" cy="133" r="3" fill="#c44536" />

                </g>
            </svg>

                    <svg viewBox="0 0 86 74" width="72" height="62">
                        <ellipse class="shadow" cx="42" cy="70" rx="18" ry="3.2" />

                            <path d="M18 34c-10-2-16-12-14-20 6 4 10 6 14 6" fill="#c43c2c" stroke="#6b1d14" stroke-width="1.4" />

                        <ellipse cx="50" cy="42" rx="14" ry="11" fill="#ffd36a" stroke="#a66b12" stroke-width="1.2" />
                        <g class="wing">
                            <ellipse cx="48" cy="42" rx="11" ry="7" fill="#d99212" stroke="#7a4b0e" stroke-width="1.4" />
                        </g>
                        <circle cx="64" cy="28" r="12" fill="#f0b429" stroke="#7a4b0e" stroke-width="1.8" />
                        <path d="M58 16c2-8 8-12 12-8-4 1-6 4-6 8z" fill="#c62828" stroke="#6b1212" stroke-width="1.2" />

                        <circle cx="68" cy="26" r="2.3" fill="#1a120c" />

                        <g class="legs">
                            <g class="leg back">
                                <path d="M38 54v12" stroke="#9a5a10" stroke-width="2.8" stroke-linecap="round" />
                                <path d="M38 66l-6 2M38 66l5 3M38 66l-1 4" stroke="#9a5a10" stroke-width="2.3" stroke-linecap="round" />
                            </g>
                            <g class="leg front">
                                <path d="M50 54v12" stroke="#7a470c" stroke-width="2.8" stroke-linecap="round" />
                                <path d="M50 66l-6 2M50 66l5 3M50 66l-1 4" stroke="#7a470c" stroke-width="2.3" stroke-linecap="round" />
                            </g>
                        </g>

                </div>
            </div>

            <div class="pet goat" id="goat">
                <div class="pet-inner">
                    <svg viewBox="0 0 110 86" width="88" height="68">
                        <ellipse class="shadow" cx="56" cy="82" rx="24" ry="3.4" />
                        <g class="horns">
                            <path d="M70 18c4-14 12-18 16-12-8 2-12 8-12 14z" fill="#8a6236" stroke="#4a3016" stroke-width="1.4" />
                            <path d="M62 18c-2-14-10-18-15-11 8 1 12 7 12 13z" fill="#8a6236" stroke="#4a3016" stroke-width="1.4" />
                        </g>
                        <ellipse class="body" cx="50" cy="48" rx="28" ry="18" fill="#d2b48c" stroke="#5c3d1e" stroke-width="1.8" />

                        <ellipse cx="58" cy="44" rx="6" ry="5" fill="#8b5a2b" stroke="#4a3016" stroke-width="1.1" />

                            <path d="M22 44c-10 2-14 10-10 16 6-6 10-8 12-8" fill="#b8956a" stroke="#5c3d1e" stroke-width="1.3" />

                        <circle cx="88" cy="34" r="2.1" fill="#1a120c" />
                        <circle cx="88.6" cy="33.5" r="0.6" fill="#fff" />
                        <path d="M94 38h8c1 2-1 4-4 4h-4z" fill="#a85c3a" stroke="#5c3d1e" stroke-width="1.1" />
                        <g class="ear">
                            <ellipse cx="70" cy="32" rx="6" ry="3.4" fill="#c48a62" stroke="#5c3d1e" stroke-width="1.2" />

                            <g class="leg back-right">
                                <path d="M44 62v16" stroke="#8b5a2b" stroke-width="4.6" stroke-linecap="round" />
                                <path d="M44 78v4" stroke="#2a1a10" stroke-width="3.6" stroke-linecap="round" />
                            </g>
                            <g class="leg front-left">
                                <path d="M58 62v16" stroke="#b8956a" stroke-width="4.6" stroke-linecap="round" />
                                <path d="M58 78v4" stroke="#2a1a10" stroke-width="3.6" stroke-linecap="round" />
                            </g>
                            <g class="leg front-right">
                                <path d="M68 62v16" stroke="#8b5a2b" stroke-width="4.6" stroke-linecap="round" />
                                <path d="M68 78v4" stroke="#2a1a10" stroke-width="3.6" stroke-linecap="round" />
                            </g>
                        </g>
                    </svg>
                </div>
            </div>

            <div class="hug-hearts">
                <span>♥</span>
                <span>♥</span>
                <span>♥</span>
            </div>

</body>
